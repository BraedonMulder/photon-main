<!DOCTYPE html>
<html>
<head>
    <title>Photon</title>

    <style>
        /* sets up the splash screen */
        body {
            margin: 0;
            background-color: black;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* keeps the logo sized to the screen */
        img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <!-- Photon logo -->
    <img src="/static/logo.jpg" alt="Photon Logo">

    <script>
        // wait 3 seconds then switch to player entry
        setTimeout(function() {
            window.location.href = "/players";
        }, 3000);
    </script>

</body>
</html>
